# Reference stanza for the Proxmox backup job. Create it through the UI/API;
# do not overwrite /etc/pve/jobs.cfg or reuse an existing job identifier blindly.
vzdump: basecamp-v1-reference
    schedule daily
    compress zstd
    enabled 1
    mode snapshot
    prune-backups keep-last=7
    storage basecamp-backups
    vmid 100,101,102
