name: Validate V1 package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/fetch_api.py
      - run: python scripts/validate_repository.py --history
      - run: python -m pytest -q tests vendor/homelab-api/tests
      - name: Parse both Compose definitions with non-secret examples
        run: |
          python scripts/render_config.py --env-file config/site.env.example --allow-examples
          docker compose --env-file config/site.env.example -f deploy/core-services/compose.yaml config --quiet
          docker compose --env-file config/site.env.example -f deploy/ai-worker/compose.yaml config --quiet
